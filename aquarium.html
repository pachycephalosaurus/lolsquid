<!DOCTYPE html>
<html>
<head>
  <base src = "/lolsquid/">
	<title> AQUARIUM </title>
	<link href="style.css" rel="stylesheet" type="text/css" media="all">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="utf-8">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    .back-button {
      position: absolute;
      top: 50px;
      left: 50vw;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }
  </style>

</head>

<body>

<!-- Sidebar start -->

<div id="navbar"></div>
<script>
  fetch('navbar.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').innerHTML = html;
    });
</script> 

<div class="stripe"></div>

<!-- Sidebar end -->
